<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .k{font-size:12px;font-weight:700;letter-spacing:.14em}
    .h{font-size:26px;font-weight:700;fill:#1a1714;font-family:Georgia,'Times New Roman',serif}
    .s{font-size:15px;fill:#5a534b}
    .m{font-family:Menlo,Consolas,monospace;font-size:12.5px;fill:#8a827a}
  </style>
  <rect width="1200" height="380" rx="22" fill="#faf8f4"/>

  <g transform="translate(36,36)">
    <rect width="358" height="308" rx="18" fill="#fff" stroke="#e7e2da" stroke-width="1.5"/>
    <rect width="358" height="6" rx="3" fill="#1e3a8a"/>
    <text x="28" y="48" class="k" fill="#1e3a8a">1 · PLAN</text>
    <text x="28" y="88" class="h">Your day, calmly</text>
    <text x="28" y="124" class="s">Today, a calendar and a board</text>
    <text x="28" y="146" class="s">for tasks, lists and sessions.</text>
    <text x="28" y="168" class="s">Unfinished work never silently</text>
    <text x="28" y="190" class="s">disappears.</text>
    <rect x="28" y="222" width="140" height="22" rx="6" fill="#1e3a8a" opacity=".14"/>
    <rect x="28" y="252" width="220" height="22" rx="6" fill="#6b21a8" opacity=".14"/>
    <rect x="182" y="222" width="90" height="22" rx="6" fill="#15803d" opacity=".16"/>
    <text x="28" y="292" class="m">epics/*/issues.md</text>
  </g>

  <g transform="translate(421,36)">
    <rect width="358" height="308" rx="18" fill="#fff" stroke="#e7e2da" stroke-width="1.5"/>
    <rect width="358" height="6" rx="3" fill="#6b21a8"/>
    <text x="28" y="48" class="k" fill="#6b21a8">2 · REMEMBER</text>
    <text x="28" y="88" class="h">Context for every AI</text>
    <text x="28" y="124" class="s">Profile, goals, decisions and</text>
    <text x="28" y="146" class="s">learnings in a second brain that</text>
    <text x="28" y="168" class="s">Claude, Cursor or any MCP agent</text>
    <text x="28" y="190" class="s">reads before it answers.</text>
    <circle cx="48" cy="238" r="9" fill="#6b21a8" opacity=".25"/>
    <circle cx="98" cy="256" r="7" fill="#0e7490" opacity=".3"/>
    <circle cx="150" cy="232" r="8" fill="#c2410c" opacity=".3"/>
    <path d="M48 238 L98 256 L150 232" stroke="#b8aea2" stroke-width="1.5" fill="none"/>
    <text x="28" y="292" class="m">brain/*.md · personal/profile.md</text>
  </g>

  <g transform="translate(806,36)">
    <rect width="358" height="308" rx="18" fill="#fff" stroke="#e7e2da" stroke-width="1.5"/>
    <rect width="358" height="6" rx="3" fill="#c2410c"/>
    <text x="28" y="48" class="k" fill="#c2410c">3 · SCROLL</text>
    <text x="28" y="88" class="h">A feed you asked for</text>
    <text x="28" y="124" class="s">Your AI writes the feed: a daily</text>
    <text x="28" y="146" class="s">brief, nudges and the ideas you</text>
    <text x="28" y="168" class="s">want. Triage tasks with a tap,</text>
    <text x="28" y="190" class="s">instead of doom-scrolling.</text>
    <rect x="28" y="216" width="150" height="58" rx="10" fill="#c2410c" opacity=".1"/>
    <rect x="40" y="230" width="96" height="8" rx="4" fill="#c2410c" opacity=".55"/>
    <rect x="40" y="248" width="120" height="6" rx="3" fill="#c2410c" opacity=".25"/>
    <rect x="192" y="226" width="56" height="22" rx="11" fill="#15803d" opacity=".85"/>
    <text x="207" y="241" font-size="11" font-weight="700" fill="#fff">Done</text>
    <text x="28" y="292" class="m">feed/*.json · routines/*.md</text>
  </g>
</svg>
